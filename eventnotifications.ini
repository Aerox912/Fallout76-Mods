;
;
; Optional language/country code to load a specific translations file, if empty English is used
; Language file has to be downloaded separately
; Example: language=jp will load translations_jp.ini
; Default: language=(empty)
language=
;
;
; Enable or disable notification by categories
; All are enabled by default (true/yes/1)
; Set to false to turn off that category completely (false/no/0)
;
; Enable or disable Infestations
enableInfestations=true
; Enable or disable Public Events
enableEvents=true
; Enable or disable Activities
enableActivities=true
; Enable or disable Mutated Events
enableMutatedEvents=true
;
;
; Configure notifications for specific events in two ways. Either backlist or whitelist
; listMode options: 'blacklist' = block matches, 'whitelist' = only show matching events
listMode=blacklist
;
; Add event names separated by commas - any part of the event name will match
; Example: filterList=Grafton Day,Monster Mash,Enclave Activity:,Defend,Horde,Bounty,Soil
; Default: filterList=(leave empty) 
filterList=Battle Bots,Grafton Day,Monster Mash,Enclave Activity:,Defend,Horde,Powering,Protest,Soil,Fly Swatter
;
;
;
;████▄  ▄▄▄   ▄▄▄▄  ▄▄ ▄▄▄▄▄▄ ▄▄  ▄▄▄  ▄▄  ▄▄ ▄▄ ▄▄  ▄▄  ▄▄▄▄ 
;██▄▄█▀ ██▀██ ███▄▄ ██   ██   ██ ██▀██ ███▄██ ██ ███▄██ ██ ▄▄ 
;██     ▀███▀ ▄▄██▀ ██   ██   ██ ▀███▀ ██ ▀██ ██ ██ ▀██ ▀███▀ 
;
; Aspect ratio setting for ultra-wide monitors (e.g., 32:9) (has predefined Xposition)
; If set to 32:9, adjusts the prompt position for ultra-wide displays
; Default is empty (no specific aspect ratio)
aspectRatio=
;
; Set the vertical position for the notification banner (this will override the aspect ratio positioning)
; Set to a number (pixels). Leave blank to use automatic aspect-ratio placement.
; Example: Yposition=-500
; Default is empty (automatic)
Yposition=-300
;
;For custom horizontal alignment (leave "aspectRatio= " emtpy if using this)
; Default is empty (automatic)
Xposition=
