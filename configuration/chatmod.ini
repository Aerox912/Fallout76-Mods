[channelVisibilitySettings]
showEvent=true
showGlobal=true
showTrade=true
showWhispers=true

[chatBoxSettings]
chatBoxVisibilityTimeout=10
chatBackground=true
chatBackgroundColor=111111
chatBackgroundOpacity=0.5
chatBoxLocation-X-Coordinate=0
chatBoxLocation-Y-Coordinate=20
chatBoxHeight=200
chatBoxWidth=600

[chatEntryBoxSettings]
chatEntryBackgroundColor=222222
chatEntryFontColor=FFFFCB
chatEntryHeight=25
chatEntryOpacity=1
chatEntryWidth=500

[userListSettings]
showUserList=false
userListHeight=500
userListLocation-X-Coordinate=100
userListLocation-Y-Coordinate=100
userListOpacity=0.8
userListWidth=500

[chatBoxTabSettings]
chatBoxTabColorFocused=222222
chatBoxTabColorOpacity=1
chatBoxTabColorUnfocused=000000
chatBoxTabFont=$MAIN_Font_Bold
chatBoxTabTextColor=F5CB5B
showChatBoxTabs=true

[emojiSettings]
emojiScale=4
showEmojis=true

[fontSettings]
chatBoxFont=$MAIN_Font
fontSize=12
alertColor=B384E0
allianceColor=C5E2B1
clanColor=CEB1E2
eventColor=FFC0CB
globalColor=FFFFCB
localColor=DB5E5E
mentionsColor=A18594
partyColor=85A1C4
serverColor=F27F5C
tradeColor=C7CEB1
whisperColor=FFC7A5

[miscellaneousSettings]
defaultToGlobalChat=true
enableRandomNameColors=true
enableTimestamps=true
openChatKey=INSERT
shortenChannelTags=true

[notificationSettings]
enableChatNoise=true
enableMentionNoise=true
enableMentions=true
playNoiseOnFocusedTabOnly=false

[hudModListSettings]
hudModList=hudmodloader