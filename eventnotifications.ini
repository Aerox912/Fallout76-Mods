;██   ██ ▀███▀  ██   ██ ██    ██ ▀████ ██▀██  ██   ██ ▀███▀ ██ ▀██   █████▀ ▀███▀ ▀███▀ ██ ▀██ ████▀ ▄▄██▀ 
;
; Sound to play when the prompt opens (default sound)
; This sound plays for any event type that doesn't have its own custom sound below
; Default: UIMenuPromptGameStateBladeOpen
soundOpen=UIMenuPromptGameStateBladeOpen
;
; Sound to play when the prompt closes
; Default: UIMenuPromptGameStateBladeClose
soundClose=UIMenuPromptGameStateBladeClose
;
; Sound to play when the timer decrements (not used yet)
; Default: UIMenuPromptGameStateCounterDecrement
soundDecrement=UIMenuPromptGameStateCounterDecrement
;
; Type-specific sounds for prompt open
; These override the default soundOpen above for specific event types
; If a type is not defined here, it uses the default soundOpen
; Example sounds: "UIXpdHudFanfareLg" "UICPRewardUnlocked" "DLC02OBJPylonTamingSirenActiveLP"
; You can find more sounds by searching terms like "UI", "Reward", "Alert", "Siren" etc. here: https://nukacrypt.com/FO76/search
; all entries that are usable sounds are labeled with "Sound Descriptor" (CAREFUL, SOME SOUNDS MAY PLAY INFINITELY)
; World Event Default: "BabylonUIEnemyTargetKilled"
soundOpen_WorldEvent=BabylonUIEnemyTargetKilled
;
; Public Event Default: "BabylonUIHuntBegins"
soundOpen_PublicEvent=BabylonUIHuntBegins
;
; Mutated Event Default: "UIXpdHudFanfareLg"
soundOpen_MutatedEvent=UIXpdHudFanfareLg
;
; Infestation Event Default: "OBJTurretAlarmAlert"
soundOpen_Infestation=OBJTurretAlarmAlert
;
; Config Sound Default: soundOpen_Config=(empty)
soundOpen_Config=
